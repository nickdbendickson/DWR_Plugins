[extend]
useDefault = true

# Each allowlist below is an independent [[allowlists]] block. gitleaks evaluates
# the conditions WITHIN one block together, so a stopword placed in the same block
# as an unrelated `paths` filter is only consulted for findings that also match
# those paths - which is why folding the discharge_m3s stopword into the baseline
# block (singular [allowlist]) left the finding uncleared. Independent blocks are
# OR'd across the config, so each clears its own finding on its own terms.

[[allowlists]]
description = "detect-secrets baselines store hashed_secret values (SHA-1 of already-reviewed false positives), not secrets"
paths = ['''(^|/)\.secrets\.baseline$''', '''^\.gitleaksignore$''']

[[allowlists]]
# `discharge_m3s` is a CSV column name read by hydro_stats() in DamSafety_Runner/core/solve_gate.py
# (and its byte-identical DamSafety_Screening copy): the discharge column ("discharge in m3/s") of a
# hydrograph CSV, not a credential. gitleaks' generic-api-key heuristic flags the `key_q = "discharge_m3s"`
# assignment (the `key` keyword + a 13-char value). Clear the EXACT literal via a stopword (a finding is
# cleared only when its secret contains this precise string), which is commit-independent - unlike a
# SHA-pinned .gitleaksignore fingerprint, which re-orphans on every history reconciliation (it did, on
# the BoannGrid stack rebase). A stopword matches the finding's secret directly, so it is reliable where
# an anchored regex is not (gitleaks' regex target is the whole match, not the bare secret). Exact literal
# only - never a path suppression of solve_gate.py, which could hide a real secret committed there.
description = "discharge_m3s is a CSV column name (not a credential); clear the exact literal, commit-independent"
stopwords = ['''discharge_m3s''']
