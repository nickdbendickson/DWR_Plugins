[extend]
useDefault = true

[allowlist]
description = "detect-secrets baselines store hashed_secret values (SHA-1 of already-reviewed false positives), not secrets"
paths = ['''(^|/)\.secrets\.baseline$''', '''^\.gitleaksignore$''']
# `discharge_m3s` is a CSV column name read by hydro_stats_csv() in DamSafety_Runner/core/solve_gate.py
# (and its byte-identical DamSafety_Screening copy): the discharge column ("discharge in m3/s") of a
# hydrograph CSV, not a credential. gitleaks' generic-api-key heuristic flags the literal. Allowlist the
# EXACT literal via a stopword (a finding is cleared only when its secret contains this precise string),
# which is commit-independent - unlike a SHA-pinned .gitleaksignore fingerprint, which re-orphans on
# every history reconciliation (it did, on the BoannGrid stack rebase). A stopword matches the finding's
# secret directly, so it is reliable where an anchored regex is not (gitleaks' regex target is the whole
# match, not the bare secret). Exact literal only - never a path suppression of solve_gate.py, which
# could hide a real secret committed there.
stopwords = ['''discharge_m3s''']
