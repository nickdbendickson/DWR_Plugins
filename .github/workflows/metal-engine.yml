name: GPU flood engine (Metal)

# The GPU flood engine (DamSafety_Runner/core/metalflood) on an Apple Silicon runner: its tests
# with the Metal kernels on the runner's GPU against their CPU build, and the small speed test.
# Linux runs the same tests (CPU build only) in ci.yml's Runner fast suite, and against
# LISFLOOD-FP in its model suite. Not a merge gate.
#
# When it runs: on a pull request that changes the engine or this file, and by hand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "DamSafety_Runner/core/metalflood/**"
      - "DamSafety_Runner/tests/test_metalflood.py"
      - "DamSafety_Runner/tests/test_boann_rain.py"
      - "DamSafety_Runner/tests/test_boann_profile.py"
      - "DamSafety_Runner/tests/test_subgrid_kernel.py"
      - "DamSafety_Runner/tests/test_subli.py"
      - "DamSafety_Runner/tests/test_subli_kernel.py"
      - "DamSafety_Runner/tests/test_boann_dry_skip.py"
      - "DamSafety_Runner/tests/test_boann_gpu_tiles.py"
      - "DamSafety_Runner/tests/test_subli_gpu_tiles.py"
      - "DamSafety_Runner/tests/test_boann_pcores.py"
      - "DamSafety_Runner/tests/test_boann_peak_dv.py"
      - "DamSafety_Runner/tests/test_boann_terrain_breach.py"
      - "DamSafety_Runner/tests/test_asc_writer.py"
      - ".github/workflows/metal-engine.yml"

permissions:
  contents: read

concurrency:
  group: metal-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metal:
    name: Apple GPU
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: numpy
        run: python -m pip install "numpy<2.3"
      # Homebrew's LLVM OpenMP runtime: Apple clang has none of its own, and with it the CPU build
      # runs on every core (backends.openmp_flag_sets); the OpenMP == one-core tests then run here
      - name: libomp
        run: brew install libomp
      - name: Metal device
        run: python -c "from nd_breach_runner.core.metalflood import metal_available; print(metal_available())"
      - name: Engine tests (Metal and the CPU build)
        run: python -m nd_breach_runner.tests.test_metalflood
      - name: Rain on the grid (ACC and FV1, Metal GPU == CPU build)
        run: python -m nd_breach_runner.tests.test_boann_rain
      - name: Dry-cell skip and the Mac OpenMP CPU build
        run: python -m nd_breach_runner.tests.test_boann_dry_skip
      - name: GPU dry-tile skip (GPU on == off bit for bit, GPU against the CPU build)
        run: python -m nd_breach_runner.tests.test_boann_gpu_tiles
      - name: Sub-grid local-inertial dry-tile skip (on == off bit for bit)
        run: python -m nd_breach_runner.tests.test_subli_gpu_tiles
      # the Mac thread default (performance cores) reads real sysctl keys here
      - name: Performance-core default and any-core-count answers
        run: python -m nd_breach_runner.tests.test_boann_pcores
      # Apple clang builds the result-grid text writer (unsigned __int128) and it writes what
      # np.savetxt writes
      - name: Result-grid text writer (the same bytes as np.savetxt)
        run: python -m nd_breach_runner.tests.test_asc_writer
      - name: Sub-grid FV kernel tests (Metal and the CPU build)
        run: python -m nd_breach_runner.tests.test_subgrid_kernel
      - name: Sub-grid local-inertial kernel and engine tests (Metal and the CPU build)
        run: python -m nd_breach_runner.tests.test_subli_kernel
      - name: Profile tests (profile on == off, on the GPU and the CPU build)
        run: python -m nd_breach_runner.tests.test_boann_profile
      - name: Peak depth x velocity (new output; old results byte-identical to main)
        run: python -m nd_breach_runner.tests.test_boann_peak_dv
      - name: Breach inside the terrain (notch in the bed; off is byte-identical)
        run: python -m nd_breach_runner.tests.test_boann_terrain_breach
      - name: Speed test (small valley)
        run: python -m nd_breach_runner.core.metalflood.bench --size small --out "$RUNNER_TEMP"
      - name: Speed test (medium valley, GPU only)
        run: python -m nd_breach_runner.core.metalflood.bench --size medium --no-cpu --out "$RUNNER_TEMP"
      - name: Profile (small diagonal valley, ACC, GPU only)
        run: python -m nd_breach_runner.core.metalflood.bench --size small --case diagonal --profile --no-cpu --out "$RUNNER_TEMP"
      - name: Profile (small diagonal valley, FV2, GPU only)
        run: python -m nd_breach_runner.core.metalflood.bench --size small --case diagonal --solver fv2 --profile --no-cpu --out "$RUNNER_TEMP"
