name: GPU flood engine (Metal)

# The GPU flood engine (DamSafety_Runner/core/metalflood) on an Apple Silicon runner: its tests
# with the Metal kernels on the runner's GPU against their CPU build, and the small speed test.
# Linux runs the same tests (CPU build only) in ci.yml's Runner fast suite, and against
# LISFLOOD-FP in its model suite. Not a merge gate.
#
# When it runs: on a pull request that changes the engine or this file, and by hand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "DamSafety_Runner/core/metalflood/**"
      - "DamSafety_Runner/tests/test_metalflood.py"
      - "DamSafety_Runner/tests/test_subgrid_kernel.py"
      - "DamSafety_Runner/tests/test_subli.py"
      - "DamSafety_Runner/tests/test_subli_kernel.py"
      - ".github/workflows/metal-engine.yml"

permissions:
  contents: read

concurrency:
  group: metal-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metal:
    name: Apple GPU
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: numpy
        run: python -m pip install "numpy<2.3"
      - name: Metal device
        run: python -c "from nd_breach_runner.core.metalflood import metal_available; print(metal_available())"
      - name: Engine tests (Metal and the CPU build)
        run: python -m nd_breach_runner.tests.test_metalflood
      - name: Sub-grid FV kernel tests (Metal and the CPU build)
        run: python -m nd_breach_runner.tests.test_subgrid_kernel
      - name: Sub-grid local-inertial kernel and engine tests (Metal and the CPU build)
        run: python -m nd_breach_runner.tests.test_subli_kernel
      - name: Speed test (small valley)
        run: python -m nd_breach_runner.core.metalflood.bench --size small --out "$RUNNER_TEMP"
      - name: Speed test (medium valley, GPU only)
        run: python -m nd_breach_runner.core.metalflood.bench --size medium --no-cpu --out "$RUNNER_TEMP"
