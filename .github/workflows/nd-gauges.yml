name: Manning's n at ND streamgages

# A study, not a gate: for each North Dakota streamgage in tools/validation/nd_gauges/gauges.json,
# the measured open-water flood discharge is run steady through a 17 km reach (USGS 3DEP 1 m
# terrain averaged to 10 m cells) with LISFLOOD-FP, through the Runner's own LISFLOOD-FP code,
# at several Manning's n and with n from NLCD land cover. The model stage at the gauge is
# compared with the stage measured with that discharge. The table is in the summary of the
# "score" job. By hand from the Actions tab, or on a pull request that changes the study.
#
# Each (gauge, run) is its OWN job on its own runner, one sim at a single thread. The three big
# basins (05117500, 06335500, 06336000) need more than 5 h for a single run when four sims share
# one 4-core runner's memory bandwidth, so they were cancelled at the old 300-min cap. One sim per
# runner keeps the method identical (single thread, same sim, same cells) and fits the budget.
# A workflow_dispatch "gauges" filter (space- or comma-separated ids, blank = all) re-runs a subset.
on:
  workflow_dispatch:
    inputs:
      gauges:
        description: "Space- or comma-separated gauge ids to run (blank = all)."
        default: ""
  pull_request:
    paths:
      - "tools/validation/nd_gauges/**"
      - ".github/workflows/nd-gauges.yml"

permissions:
  contents: read

concurrency:
  group: nd-gauges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.gen.outputs.combos }}
    steps:
      - id: gen
        env:
          GAUGES: ${{ inputs.gauges }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all_g = ["USGS-05116000", "USGS-05117500", "USGS-05120000", "USGS-06335500",
                   "USGS-06336000", "USGS-06348300", "USGS-05090000"]
          runs = ["n035", "n040", "n050", "n060", "nlcd"]
          sel = os.environ.get("GAUGES", "").replace(",", " ").split()
          g = [x for x in all_g if (not sel or x in sel)]
          combos = [{"gauge": x, "run": r} for x in g for r in runs]
          print("combos=" + json.dumps(combos))
          PY

  reach:
    needs: setup
    name: ${{ matrix.gauge }} ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.combos) }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Provision QGIS + a scipy-compatible numpy
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qgis
          create-args: >-
            python=3.12 qgis numpy<2 scipy gdal
      # the same key as model-tests in ci.yml, so they share one build
      - name: Cache the patched LISFLOOD-FP
        id: lisflood-cache
        uses: actions/cache@v6
        with:
          path: ~/lisflood-nd
          key: lisflood-8.3-${{ runner.os }}-${{ hashFiles('DamSafety_Runner/scripts/patch_lisflood.py', 'DamSafety_Runner/scripts/build_lisflood_linux.sh') }}
      - name: Build the patched LISFLOOD-FP
        if: steps.lisflood-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o lisflood.zip https://zenodo.org/api/records/13121119/files/LISFLOOD-FP-8.3.zip/content
          echo "abaa2e41b58f6c7df4443274bf130d4a  lisflood.zip" | md5sum -c -
          unzip -q lisflood.zip
          bash "$GITHUB_WORKSPACE/DamSafety_Runner/scripts/build_lisflood_linux.sh" \
            "$RUNNER_TEMP/LISFLOOD-FP-8.3/source" "$HOME/lisflood-nd"
      - name: Build the reach (NHD river line, 3DEP 1 m terrain, NLCD)
        run: python tools/validation/nd_gauges/reach.py build ${{ matrix.gauge }} --out "$RUNNER_TEMP/nd/${{ matrix.gauge }}"
      - name: Run one (${{ matrix.run }}), one thread
        run: |
          base="python tools/validation/nd_gauges/reach.py run $RUNNER_TEMP/nd/${{ matrix.gauge }} --lisflood $HOME/lisflood-nd/lisflood --threads 1"
          case "${{ matrix.run }}" in
            n035) $base --n 0.035 ;;
            n040) $base --n 0.04 ;;
            n050) $base --n 0.05 ;;
            n060) $base --n 0.06 ;;
            nlcd) $base --nlcd ;;
            *) echo "unknown run ${{ matrix.run }}"; exit 1 ;;
          esac
      - name: Stage the results under the gauge name
        if: always()
        run: |
          d="$RUNNER_TEMP/nd/${{ matrix.gauge }}"
          mkdir -p "stage/${{ matrix.gauge }}/runs"
          [ -f "$d/reach.json" ] && cp "$d/reach.json" "stage/${{ matrix.gauge }}/"
          cp -r "$d"/runs/* "stage/${{ matrix.gauge }}/runs/" 2>/dev/null || true
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nd-gauge-${{ matrix.gauge }}-${{ matrix.run }}
          if-no-files-found: warn
          path: stage

  score:
    needs: reach
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: nd-gauge-*
          path: nd
          merge-multiple: true
      - name: Score
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys; sys.argv=["x"]
          sys.path.insert(0, "tools/validation/nd_gauges")
          import reach
          reach.score("nd", say=print)
          PY
