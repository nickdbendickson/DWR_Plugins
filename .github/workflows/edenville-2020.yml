name: Edenville-Sanford 2020 (real cascade dam failure)

# The 2020 Edenville -> Sanford dam-break flood at the Tittabawassee gauge at Midland, Michigan,
# in two tests (tools/validation/edenville_2020/). A study, not a gate: a job is red only when a
# run does not finish or a case cannot be built. The numbers are in each job's summary.
#
#   * "Midland reach (10 m roughness)": midland_reach.py runs the OBSERVED 51,800 cfs steady
#     through a 17 km reach around the gauge (3DEP 1 m terrain to 10 m cells) at several Manning's
#     n and with NLCD, and compares the model stage with the observed 614.61 ft NAVD88. The same
#     test as the ND streamgages (nd-gauges.yml), on the one Michigan gauge. It isolates roughness.
#
#   * "Edenville-Sanford cascade (30 m)": cascade_case.py drives the Runner's own cascade engine
#     headless -- Edenville fails sunny-day at normal pool, the surge overtops and breaches Sanford,
#     and the combined flood is routed to the Midland gauge -- and compares the modelled breach
#     peaks with the peer-reviewed ASCE 2-D model and the peak stage at Midland with the gauge.
#     It isolates the cascade dam-break physics. The clock is capped (the peak reaches the gauge
#     well inside a day; the long drain-down only slows the run).
#
# By hand (Actions > this workflow > Run workflow) or on a pull request that changes the case.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/validation/edenville_2020/**"
      - "tools/validation/nd_gauges/**"
      - ".github/workflows/edenville-2020.yml"

permissions:
  contents: read

concurrency:
  group: edenville-2020-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The reach is built ONCE and handed to the five runs: five builds at once (four 3DEP workers
  # each, 81 tiles) drew HTTP 504s from the 3DEP image server and failed a lane in its build step.
  midland-build:
    name: Midland reach build (3DEP 1 m terrain, NLCD)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      GAUGE: USGS-04156000
    steps:
      - uses: actions/checkout@v7
      - name: Provision QGIS + a scipy-compatible numpy
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qgis
          create-args: >-
            python=3.12 qgis numpy<2 scipy gdal
      - name: Build the reach (NHD river line, 3DEP 1 m terrain, NLCD)
        run: python tools/validation/edenville_2020/midland_reach.py build --out "$RUNNER_TEMP/mid/$GAUGE"
      - name: Keep the built reach (without the 3DEP tile cache)
        uses: actions/upload-artifact@v7
        with:
          name: midland-terrain
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ runner.temp }}/mid/${{ env.GAUGE }}/reach.json
            ${{ runner.temp }}/mid/${{ env.GAUGE }}/dem.asc
            ${{ runner.temp }}/mid/${{ env.GAUGE }}/nlcd.npy

  # One run per job, on its own runner. The five runs used to share one 4-core runner (four
  # single-thread runs side by side, then NLCD): on the 3.2 M-cell reach every default ACC run
  # gains water at 51,800 cfs (outflow/inflow 3.5-4.4) and, since the reach harness gained the
  # Runner's stability cure (#413), is then re-run with theta 0.7 / CFL 0.5. Two full runs per lane
  # on a shared runner (memory-bandwidth bound) plus NLCD behind them no longer fits the cap, so
  # the job was cancelled every time. Here each run gets the whole runner and all four threads
  # (LISFLOOD-FP's output does not depend on the thread count), the same way nd-gauges.yml runs.
  midland-reach:
    name: Midland reach (10 m roughness) ${{ matrix.run }}
    needs: midland-build
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        run: [n035, n040, n050, n060, nlcd]
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      GAUGE: USGS-04156000
    steps:
      - uses: actions/checkout@v7
      - name: Provision QGIS + a scipy-compatible numpy
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qgis
          create-args: >-
            python=3.12 qgis numpy<2 scipy gdal
      # the same key as model-tests in ci.yml and the other validation jobs, so all share one build
      - name: Cache the patched LISFLOOD-FP
        id: lisflood-cache
        uses: actions/cache@v6
        with:
          path: ~/lisflood-nd
          key: lisflood-8.3-${{ runner.os }}-${{ hashFiles('DamSafety_Runner/scripts/patch_lisflood.py', 'DamSafety_Runner/scripts/build_lisflood_linux.sh') }}
      - name: Build the patched LISFLOOD-FP
        if: steps.lisflood-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o lisflood.zip https://zenodo.org/api/records/13121119/files/LISFLOOD-FP-8.3.zip/content
          echo "abaa2e41b58f6c7df4443274bf130d4a  lisflood.zip" | md5sum -c -
          unzip -q lisflood.zip
          bash "$GITHUB_WORKSPACE/DamSafety_Runner/scripts/build_lisflood_linux.sh" \
            "$RUNNER_TEMP/LISFLOOD-FP-8.3/source" "$HOME/lisflood-nd"
      - name: Fetch the built reach
        uses: actions/download-artifact@v4
        with:
          name: midland-terrain
          path: ${{ runner.temp }}/mid/${{ env.GAUGE }}
      - name: Run ${{ matrix.run }} (four threads)
        run: |
          base="python tools/validation/edenville_2020/midland_reach.py run $RUNNER_TEMP/mid/$GAUGE --lisflood $HOME/lisflood-nd/lisflood --threads 4"
          case "${{ matrix.run }}" in
            n035) $base --n 0.035 ;;
            n040) $base --n 0.04 ;;
            n050) $base --n 0.05 ;;
            n060) $base --n 0.06 ;;
            nlcd) $base --nlcd ;;
            *) echo "unknown run ${{ matrix.run }}"; exit 1 ;;
          esac
      - name: Stage the result
        if: always()
        run: |
          d="$RUNNER_TEMP/mid/$GAUGE"
          mkdir -p "stage/$GAUGE/runs"
          [ -f "$d/reach.json" ] && cp "$d/reach.json" "stage/$GAUGE/"
          for r in "$d"/runs/*/; do
            [ -f "$r/result.json" ] || continue
            mkdir -p "stage/$GAUGE/runs/$(basename "$r")"
            cp "$r/result.json" "stage/$GAUGE/runs/$(basename "$r")/"
          done
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: midland-reach-${{ matrix.run }}
          if-no-files-found: warn
          path: stage

  midland-score:
    name: Midland reach score
    needs: midland-reach
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: midland-reach-*
          path: mid
          merge-multiple: true
      - name: Score the reach against the observed 614.61 ft
        run: |
          python tools/validation/edenville_2020/midland_reach.py score mid
          cat mid/Midland_Reach_Score.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reach results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: midland-reach
          if-no-files-found: warn
          path: |
            mid/Midland_Reach_Score.*
            mid/*/reach.json
            mid/*/runs/*/result.json

  cascade:
    name: Edenville-Sanford cascade (30 m)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      HOURS: "48"
    steps:
      - uses: actions/checkout@v7
      - name: Provision QGIS + a scipy-compatible numpy
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qgis
          create-args: >-
            python=3.12 qgis numpy<2 scipy gdal
      - name: Cache the patched LISFLOOD-FP
        id: lisflood-cache
        uses: actions/cache@v6
        with:
          path: ~/lisflood-nd
          key: lisflood-8.3-${{ runner.os }}-${{ hashFiles('DamSafety_Runner/scripts/patch_lisflood.py', 'DamSafety_Runner/scripts/build_lisflood_linux.sh') }}
      - name: Build the patched LISFLOOD-FP
        if: steps.lisflood-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o lisflood.zip https://zenodo.org/api/records/13121119/files/LISFLOOD-FP-8.3.zip/content
          echo "abaa2e41b58f6c7df4443274bf130d4a  lisflood.zip" | md5sum -c -
          unzip -q lisflood.zip
          bash "$GITHUB_WORKSPACE/DamSafety_Runner/scripts/build_lisflood_linux.sh" \
            "$RUNNER_TEMP/LISFLOOD-FP-8.3/source" "$HOME/lisflood-nd"
      - name: The case's own tests (no internet, no LISFLOOD-FP)
        run: python -W error tools/validation/edenville_2020/test_case.py
      - name: Build the corridor terrain (3DEP, Edenville -> Sanford -> Midland, 30 m)
        run: python tools/validation/edenville_2020/cascade_case.py build --out "$RUNNER_TEMP/cascade"
      - name: Run the cascade (Edenville breach -> Sanford overtops -> Midland)
        run: |
          python tools/validation/edenville_2020/cascade_case.py run "$RUNNER_TEMP/cascade" \
            --lisflood "$HOME/lisflood-nd/lisflood" --threads 4 --rule overtop --hours "$HOURS" \
            2>&1 | tee cascade.log
      - name: Score against the ASCE model and the Midland gauge
        if: always()
        run: |
          python tools/validation/edenville_2020/cascade_case.py score "$RUNNER_TEMP" || true
          cat "$RUNNER_TEMP/Edenville_Sanford_2020_Score.md" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the score, the report and the combined rasters
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edenville-sanford-cascade
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/Edenville_Sanford_2020_Score.*
            ${{ runner.temp }}/cascade/cascade.json
            ${{ runner.temp }}/cascade/result.json
            ${{ runner.temp }}/cascade/cascade_run.log
            ${{ runner.temp }}/cascade/Cascade_*/Cascade_Report.md
            ${{ runner.temp }}/cascade/Cascade_*/Cascade *.asc
