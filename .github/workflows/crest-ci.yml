name: Crest CI

# Crest (dwr_crest/): typecheck, lint, unit tests + the bundle check, the browser click-through, and the desktop
# server tests. Moved here from the nickdbendickson/crest repo (its "CI" workflow) on 2026-11-19; every step runs
# inside dwr_crest/. Only runs when dwr_crest/ or this file changes.

on:
  push:
    branches: [main]
    paths: ["dwr_crest/**", ".github/workflows/crest-ci.yml"]
  pull_request:
    paths: ["dwr_crest/**", ".github/workflows/crest-ci.yml"]

# A newer push to the same branch cancels the older in-progress run (but never a run on main).
concurrency:
  group: crest-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: dwr_crest

jobs:
  crest-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dwr_crest/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Runs the unit tests and the scripts/*.test.mjs suite, which includes the
      # desktop-bundle freshness check (the committed bundle matches its source).
      - name: Test
        run: npm test

  # Browser click-through (e2e/): Chromium opens the desktop bundle behind its Python server and the built
  # web app, and walks the eight steps on the first sample dam with every public service stubbed. Fails on an uncaught
  # error, a console error, or anything the Content-Security-Policy blocks.
  crest-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dwr_crest/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the web app
        run: npm run build
      - name: Click-through
        env:
          E2E_WEB: "1"
        run: npm run test:e2e

  # The crest-desktop Python server/handoff tests (stdlib unittest, no third-party deps). They were not run in
  # CI before, so the desktop robustness fixes only had local coverage; this gates them too.
  # Also on Windows and macOS, where the desktop app is installed (the server, the save / open paths and the bundle
  # hashes are the parts that differ by platform); the pywebview window itself is not opened.
  crest-desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Desktop tests
        working-directory: dwr_crest/crest-desktop
        run: python -m unittest discover -s tests
